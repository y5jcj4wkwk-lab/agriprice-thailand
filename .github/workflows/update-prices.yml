# Weekday official-price snapshot + static GitHub Pages deploy.
# Cron times are UTC. ICT = UTC+7.
#
#   00:30 UTC  →  07:30 ICT  (early rubber / corn)
#   02:30 UTC  →  09:30 ICT  (after morning TRA / TMTPA posts)
#   04:00 UTC  →  11:00 ICT  (late morning catch-up)
#   07:00 UTC  →  14:00 ICT  (afternoon prints)
#   09:00 UTC  →  16:00 ICT  (close of board)
#
# TRA local table defaults to the current calendar month. Early in a new
# month that page is empty — the scraper also pulls the previous month.
#
# Weekends are skipped — TRA / TMTPA typically do not post.
# workflow_dispatch lets you click "Run workflow" in the Actions tab.
name: Update official prices

on:
  schedule:
    - cron: "30 0 * * 1-5"
    - cron: "30 2 * * 1-5"
    - cron: "0 4 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - "public/data/official-board.json"

concurrency:
  group: update-prices
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Scrape official boards
        run: node --experimental-strip-types scripts/scrape-prices.mjs

      - name: Commit snapshot if prices changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/official-board.json
          if git diff --staged --quiet; then
            echo "No price change"
            exit 0
          fi
          git commit -m "chore: official crop prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Install
        run: npm ci

      - name: Resolve Pages base path
        id: base
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$REPO_NAME" = "${OWNER}.github.io" ]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static site
        env:
          PAGES: "1"
          VITE_PAGES: "true"
          GITHUB_PAGES_BASE: ${{ steps.base.outputs.base }}
        run: npm run build:pages

      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages-dist
          force_orphan: true
          enable_jekyll: false
